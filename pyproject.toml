[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-installer-packer"
version = "0.1.0"
description = "简包装-应用安装向导打包软件 —— 把 .aiproj 工程编译成 Windows 安装包"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pyinstaller>=6"]

[project.scripts]
aipack = "app.cli:main"

[tool.setuptools]
packages = ["app", "app.core", "app.engine", "app.ui", "app.ui.pages"]
